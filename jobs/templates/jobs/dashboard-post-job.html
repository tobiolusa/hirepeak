{% extends 'jobs/base.html' %}

{% block content %}
  <!-- Dashboard -->
  <section class="user-dashboard">
    <div class="dashboard-outer">
      <div class="upper-title-box">
        <h3>Post a New Job!</h3>
        <div class="text">Ready to jump back in?</div>
      </div>

      <div class="row">
        <div class="col-lg-12">
          <!-- Ls widget -->
          <div class="ls-widget">
            <div class="tabs-box">
              <div class="widget-title">
                <h4>Post Job</h4>
              </div>

              <div class="widget-content">

                <div class="post-job-steps">
                  
               
                </div>


  
  
<form method="POST" action="{% url 'post_job' %}" class="default-form">
  {% csrf_token %}
  
  <!-- Job Title -->
  <div class="form-group">
    <label for="job_title">Job Title <span class="text-danger">*</span></label>
    <input type="text" name="job_title" id="job_title" class="form-control" placeholder="e.g. Frontend Developer" required>
  </div>

 

  <!-- Experience Level -->
  <div class="form-group">
    <label for="experience_level">Experience Level <span class="text-danger">*</span></label>
    <select name="experience_level" id="experience_level" class="form-control" required>
      <option value="">Select</option>
      <option value="entry_level">Entry-Level</option>
      <option value="junior">Junior</option>
      <option value="mid-level">Mid-level</option>
      <option value="senior">Senior</option>
    </select>
  </div>

  <!-- Salary Range -->
  <div class="form-group">
    <label for="salary_range">Offered Salary</label>
    <input type="text" name="salary_range" id="salary_range" class="form-control" placeholder="e.g. ₦250,000 - ₦350,000">
  </div>

  <!-- Job Location -->
  <div class="form-group">
    <label for="location">Job Location <span class="text-danger">*</span></label>
    <input type="text" name="location" id="location" class="form-control" placeholder="e.g. Lagos, Nigeria" required>
  </div>

  <!-- Employment Type -->
  <div class="form-group">
    <label for="employment_type">Employment Type <span class="text-danger">*</span></label>
    <select name="employment_type" id="employment_type" class="form-control" required>
      <option value="">Select</option>
      <option value="full_time">Full-Time</option>
      <option value="part_time">Part-Time</option>
      <option value="contract">Contract</option>
      <option value="freelance">Freelance</option>
    </select>
  </div>

  <!-- Job Mode -->
  <div class="form-group">
    <label for="job_mode">Job Mode <span class="text-danger">*</span></label>
    <select name="job_mode" id="job_mode" class="form-control" required>
      <option value="">Select</option>
      <option value="remote">Remote</option>
      <option value="onsite">Onsite</option>
      <option value="hybrid">Hybrid</option>
    </select>
  </div>
   <!-- Job Description -->
  <div class="form-group">
    <label for="description">Job Description <span class="text-danger">*</span></label>
    <textarea name="description" id="description" class="form-control" rows="6" placeholder="Describe the role, responsibilities, and expectations..." required></textarea>
  </div>
  
  <!-- Other Requirements -->
  <div class="form-group">
    <label for="requirement">Other Requirements (Optional)</label>
    <textarea name="requirement" id="requirement" class="form-control" rows="4" placeholder="e.g. Familiar with Django, React, good communication skills..."></textarea>
  </div>

  <!-- Submit -->
  <div class="form-group text-right mt-3">
    <button type="submit" class="btn btn-primary btn-lg">Post Job</button>
  </div>
  
</form>



              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Dashboard -->
{% endblock %}
