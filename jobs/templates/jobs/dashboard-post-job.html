{% extends 'jobs/base.html' %}

{% block content %}
  <!-- Dashboard -->
  <section class="user-dashboard">
    <div class="dashboard-outer">
      <div class="upper-title-box">
        <h3>Post a New Job!</h3>
        <div class="text">Ready to jump back in?</div>
      </div>

      <div class="row">
        <div class="col-lg-12">
          <!-- Ls widget -->
          <div class="ls-widget">
            <div class="tabs-box">
              <div class="widget-title">
                <h4>Post Job</h4>
              </div>

              <div class="widget-content">

                <div class="post-job-steps">
                  
               
                </div>

         <form method="POST" class="default-form">
  {% csrf_token %}
  <div class="row">
    
    <!-- Job Title -->
    <div class="form-group col-lg-12">
      <label for="job_title">Job Title</label>
      <input type="text" name="job_title" id="job_title" placeholder="e.g. Frontend Developer" required>
    </div>

    <!-- Job Description -->
    <div class="form-group col-lg-12">
      <label for="description">Job Description</label>
      <textarea name="description" id="description" rows="6" placeholder="Describe the role, responsibilities, and expectations..." required></textarea>
    </div>

    <!-- Experience Level -->
    <div class="form-group col-lg-6">
      <label for="experience_level">Experience Level</label>
      <select name="experience_level" id="experience_level" class="chosen-select" required>
        <option value="">Select</option>
        <option value="entry_level">Entry-Level</option>
        <option value="junior">Junior</option>
        <option value="mid-level">Mid-level</option>
        <option value="senior">Senior</option>
      </select>
    </div>

    <!-- Salary Range -->
    <div class="form-group col-lg-6">
      <label for="salary_range">Offered Salary</label>
      <input type="text" name="salary_range" id="salary_range" placeholder="e.g. $2500 - $3500">
    </div>

    <!-- Location -->
    <div class="form-group col-lg-6">
      <label for="location">Job Location</label>
      <input type="text" name="location" id="location" placeholder="e.g. Lagos, Nigeria" required>
    </div>

    <!-- Employment Type -->
    <div class="form-group col-lg-6">
      <label for="employment_type">Employment Type</label>
      <select name="employment_type" id="employment_type" class="chosen-select" required>
        <option value="">Select</option>
        <option value="full_time">Full-Time</option>
        <option value="part_time">Part-Time</option>
        <option value="contract">Contract</option>
        <option value="freelance">Freelance</option>
      </select>
    </div>

    <!-- Job Mode -->
    <div class="form-group col-lg-6">
      <label for="job_mode">Job Mode</label>
      <select name="job_mode" id="job_mode" class="chosen-select" required>
        <option value="">Select</option>
        <option value="remote">Remote</option>
        <option value="onsite">Onsite</option>
        <option value="hybrid">Hybrid</option>
      </select>
    </div>

    <!-- Additional Requirements -->
    <div class="form-group col-lg-12">
      <label for="requirement">Other Requirements</label>
      <textarea name="requirement" id="requirement" rows="4" placeholder="e.g. Experience with Django, React, good communication skills..."></textarea>
    </div>

    <!-- Submit Button -->
    <div class="form-group col-lg-12 text-right">
      <button type="submit" class="theme-btn btn-style-one">Post Job</button>
    </div>

  </div>
</form>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Dashboard -->
{% endblock %}
