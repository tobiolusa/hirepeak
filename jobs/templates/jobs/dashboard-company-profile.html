{% extends 'jobs/base.html' %}

{% block content %}
  <!-- Dashboard -->
  <section class="user-dashboard">
    <div class="dashboard-outer">
      <div class="upper-title-box">
        <h3>Company Profile!</h3>
        <div class="text">Ready to jump back in?</div>
      </div>

      <div class="row">
        <div class="col-lg-12">
          <!-- Ls widget -->
          <div class="ls-widget">
            <div class="tabs-box">
              <div class="widget-title">
                <h4>My Profile</h4>
              </div>

              <div class="widget-content">
                {% if messages %}
        <ul>
            {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}"{% endif %}> {{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

               <form class="default-form" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="row">

    <!-- Company Name -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Company Name</label>
      <input type="text" name="company_name" placeholder="Amazon" required>
    </div>

    <!-- Company Email -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Company Email</label>
      <input type="email" name="company_email" placeholder="career@amazon.com" required>
    </div>

    <!-- Industry -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Industry</label>
      <input type="text" name="industry" placeholder="Technology" required>
    </div>

    <!-- Team Size -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Company Size</label>
      <input type="number" name="size" placeholder="50" min="1" required>
    </div>

    <!-- About Company -->
    <div class="form-group col-lg-12 col-md-12">
      <label>About Company</label>
      <textarea name="company_about" placeholder="Describe your company..."></textarea>
    </div>

    <!-- Location -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Location</label>
      <input type="text" name="location" placeholder="Lagos, Nigeria" required>
    </div>

    <!-- Website -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Website</label>
      <input type="url" name="website" placeholder="https://example.com">
    </div>

    <!-- Company Logo -->
    <div class="form-group col-lg-6 col-md-12">
      <label>Company Logo</label>
      <input type="file" name="logo" accept="image/*">
    </div>

    <!-- Submit -->
    <div class="form-group col-lg-12 col-md-12">
      <button class="theme-btn btn-style-one" type="submit">Update Profile</button>
    </div>

  </div>
</form>
 

                
                
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
    <!-- End Dashboard -->
{% endblock %}
